name: Build patched Codex for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out Codex 0.145.0
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: rust-v0.145.0
          fetch-depth: 0

      - name: Apply duplicate-approval fix
        shell: pwsh
        run: |
          git fetch https://github.com/ttkengo/codex.git fix/apply-patch-retry-approval
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 5ebb6d0de103f628854cc0cce3b5892d4ae0dfb8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build codex.exe
        working-directory: codex-rs
        run: cargo build --release --locked --bin codex

      - name: Upload patched binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-0.145.0-apply-patch-fix-windows-x64
          path: codex-rs/target/release/codex.exe
          if-no-files-found: error

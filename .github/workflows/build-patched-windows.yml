name: Build complete patched Codex for Windows

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out Codex 0.145.0
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: rust-v0.145.0
          fetch-depth: 0

      - name: Apply duplicate-approval fix
        shell: pwsh
        run: |
          git fetch https://github.com/ttkengo/codex.git fix/apply-patch-retry-approval
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 5ebb6d0de103f628854cc0cce3b5892d4ae0dfb8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          cache-on-failure: true

      - name: Download previously built patched codex.exe
        uses: actions/download-artifact@v4
        with:
          name: codex-0.145.0-apply-patch-fix-windows-x64
          path: bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ttkengo/codex
          run-id: 30106558709

      - name: Build matching Windows sandbox helpers
        working-directory: codex-rs
        shell: pwsh
        env:
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
        run: cargo build --release --bin codex-windows-sandbox-setup --bin codex-command-runner

      - name: Assemble complete bundle
        shell: pwsh
        run: |
          Copy-Item codex-rs/target/release/codex-windows-sandbox-setup.exe bundle/ -Force
          Copy-Item codex-rs/target/release/codex-command-runner.exe bundle/ -Force
          Get-ChildItem bundle

      - name: Upload complete patched bundle
        uses: actions/upload-artifact@v4
        with:
          name: codex-0.145.0-apply-patch-fix-windows-complete
          path: bundle/*
          if-no-files-found: error
